<header><div id="title"></div><span class="s" id="src"></span></header>
<div id="wrap"><div id="mapbox"><div id="map"></div><div class="legend"><span><i style="background:#12a39c"></i>호가 형성 단지 (매매 매물 확인)</span><span><i style="background:#e08a1e"></i>입주 초기 · 매매 호가 거의 없음</span><span class="lg2">기준점: 운정중앙역 / 운정3지구 반경 약 1.6km · 사용승인 10년 이내</span></div></div><div id="panel"><div id="err"></div></div></div>

<script>
(function(){

var BANDS=[['전용 59~60㎡',57,62],['전용 72~76㎡',70,77],['전용 84~85㎡',83,86],['전용 97~111㎡',96,111],['전용 112㎡ 이상',111.5,200]];
function overview(){

  });

  h+='<table class="st"><colgroup><col style="width:40px"><col><col style="width:64px"><col style="width:62px"><col style="width:78px"><col style="width:78px"></colgroup>';
  h+='<tr class="rg"><td colspan="6">호가 형성 단지<small>매매 매물 확인 · 평당가순</small></td></tr><tr><th>번호</th><th>단지</th><th>입주</th><th>세대수</th><th>평균 평당</th><th>중앙 평당</th></tr>';

function wire(){[].forEach.call(document.querySelectorAll('[data-i]'),function(e){e.onclick=function(){render(+e.getAttribute('data-i'));if(window.__go)window.__go(+e.getAttribute('data-i'))}});var b=document.querySelector('[data-back]');if(b)b.onclick=function(){render(-1)}}
function render(i){

  cur=i;var c=D[i],G=c.group;
