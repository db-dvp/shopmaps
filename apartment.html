<style>

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.x{color:#6b7280;font-size:11px}.big{display:flex;gap:10px;margin:6px 0}.big>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.big .k{display:block;font-size:11px;color:var(--mut)}.big b{font-size:24px;color:var(--navy)}.big .u{font-size:11px;color:var(--mut);margin-left:4px}.rg{font-size:15px;margin:20px 0 0;padding-top:8px;border-top:2px solid var(--navy)}tr.go{cursor:pointer}tr.go:hover td{background:var(--bg)}.warn{font-size:12px;color:var(--up);margin-top:6px}.modes{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--navy);border-radius:6px;overflow:hidden}.mode{flex:1;border:0;background:#fff;color:var(--navy);padding:7px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}.mode.on{background:var(--navy);color:#fff}.mode+.mode{border-left:1px solid var(--navy)}

.no{display:inline-block;min-width:22px;padding:1px 5px;border-radius:11px;color:#fff;font-weight:700;font-size:11px;text-align:center}.no.L{background:#2f6fd6}.no.S{background:#12a39c}.no.H{background:#8a5cc7}.no.W{background:#e08a1e}
.back{border:0;background:var(--bg);color:var(--navy);font:inherit;font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;margin-bottom:8px}.back:hover{background:#e3e8f3}
.dh{display:flex;align-items:center;gap:8px}.dh .no{font-size:13px;padding:3px 9px;border-radius:14px}.dh h2{font-size:17px;margin:0;color:var(--navy)}

.big b.nb{font-size:16px;color:var(--mut);font-weight:600}
.plans{display:flex;gap:10px;margin:8px 0 2px}.pl{flex:1;margin:0;border:1px solid var(--line);border-radius:8px;background:#fbfbfb;padding:6px;cursor:zoom-in;text-align:center}.pl:hover{border-color:var(--navy)}.pl img{display:block;width:100%;height:150px;object-fit:contain}.pl figcaption{font-size:11.5px;font-weight:700;color:var(--navy);margin-top:3px}
#lb{position:fixed;inset:0;background:rgba(10,14,30,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:zoom-out}#lb img{max-width:94vw;max-height:86vh;object-fit:contain;background:#fbfbfb;border-radius:10px}#lb div{color:#fff;font-size:14px;font-weight:700}
</style>
<style>
.pin.A{--c:#12a39c}.pin.B{--c:#e08a1e}.no.A{background:#12a39c}.no.B{background:#e08a1e}.bd.A{background:#12a39c}.bd.B{background:#e08a1e}

.sh{cursor:pointer;user-select:none}.sh .ar{font-size:9px;color:#9aa3b8;margin-left:2px}tr.fr td{background:#f7f8fc;padding:3px 2px}.fi{font:inherit;font-size:11px;width:100%;border:1px solid var(--line);border-radius:5px;padding:2px 3px;text-align:center}.fi.h{width:50%}.fi.h:first-child{border-right:0}.lk{display:inline-block;background:#fdeed7;color:#a35a00;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700;margin-left:5px;vertical-align:1px}

<body>
<header><div id="title"></div><span class="s" id="src"></span></header>
<div id="wrap"><div id="mapbox"><div id="map"></div><div class="legend"><span><i style="background:#12a39c"></i>호가 형성 단지 (매매 매물 확인)</span><span><i style="background:#e08a1e"></i>입주 초기 · 매매 호가 거의 없음</span><span class="lg2">기준점: 운정중앙역 / 운정3지구 반경 약 1.6km · 사용승인 10년 이내</span></div></div><div id="panel"><div id="err"></div></div></div>
<script src="data-apartment.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)}, Q=3.3058;
var RAW=window.APT_DATA||[];
function pp(c){return c.overall?c.overall.ppAvg:-1}
var A=RAW.filter(function(c){return c.group==='A'}).sort(function(a,b){return pp(b)-pp(a)});
var B=RAW.filter(function(c){return c.group==='B'}).sort(function(a,b){return a.appr<b.appr?-1:1});
var D=A.concat(B), cur=-1, F={g:'',q:'',r:{},s:'pp',d:-1};
var NO={556054:13,1028889:5,2147431:16,2148664:15,1077216:10,1095862:9,658235:2,1027762:1,1097534:7,32313:6,32117:8,40137:11,489087:4,46086:12,46900:20,46084:18,47952:19,433593:14,491116:17,352637:3};
function N(c){return NO[c.id]||0}
$('title').textContent='운정3지구 인근 아파트 최근 호가 · 평당가'; $('src').textContent='호가: KB부동산 26.10 / 분양가: 호갱노노';
function eok(v){return (v/10000).toFixed(2)+'억'}
function f0(v){return Math.round(v).toLocaleString()}
function yr(c){var m=c.appr.match(/^(\d{4})\.(\d{2})/);return m?m[1]+'.'+m[2]:c.appr}
function wmean(list,f){var tn=0,ta=0;list.forEach(function(x){var v=f(x);if(v!=null){tn+=x.n;ta+=v*x.n}});return tn?{v:ta/tn,n:tn}:null}
function allTypes(){var r=[];A.forEach(function(c){c.types.forEach(function(t){if(t.n)r.push(t)})});return r}
var BANDS=[['전용 59~60㎡',57,62],['전용 72~76㎡',70,77],['전용 84~85㎡',83,86],['전용 97~111㎡',96,111],['전용 112㎡ 이상',111.5,200]];
function overview(){
  var h='<h2>운정3지구 인근 아파트 최근 호가 · 평당가</h2><div class="sub">단위: 만원/평 · 전용면적 3.3058㎡당 · KB부동산 매매 호가(같은 매물 합침) · 사용승인 10년 이내 · 행을 누르면 단지 상세</div>';
  var all=allTypes(), tot=wmean(all,function(t){return t.ppEx});
  var meds=A.map(function(c){return c.overall.ppAvg}).sort(function(a,b){return a-b}), n=meds.length;
  var med=n%2?meds[(n-1)>>1]:(meds[n/2-1]+meds[n/2])/2;
  h+='<div class="big"><div><span class="k">호가 단지 전체 평균 (매물 가중)</span><b>'+f0(tot.v)+'</b><span class="u">만원/평 · '+tot.n+'건 · '+A.length+'개 단지</span></div><div><span class="k">단지 평균의 중앙값</span><b>'+f0(med)+'</b><span class="u">만원/평</span></div></div>';
  h+='<h3>면적대별 평균 (호가 형성 단지 전체)</h3><table><tr><th>면적대</th><th>건수</th><th>평균 호가</th><th>전용 평당</th><th>단지별 평당 최저~최고</th></tr>';
  BANDS.forEach(function(b){
    var ts=all.filter(function(t){return t.ex>=b[1]&&t.ex<=b[2]}); if(!ts.length)return;
    var p=wmean(ts,function(t){return t.ppEx}), pr=wmean(ts,function(t){return t.avg});
    var by={};A.forEach(function(c){var x=c.types.filter(function(t){return t.n&&t.ex>=b[1]&&t.ex<=b[2]});if(x.length)by[c.id]=wmean(x,function(t){return t.ppEx}).v});
    var vs=Object.keys(by).map(function(k){return by[k]});
    h+='<tr><td class="l">'+b[0]+'</td><td>'+p.n+'</td><td>'+f0(pr.v)+' ('+eok(pr.v)+')</td><td><b>'+f0(p.v)+'</b></td><td>'+f0(Math.min.apply(null,vs))+' ~ '+f0(Math.max.apply(null,vs))+'</td></tr>';
  });
  h+='</table>';
  h+='<div class="flt" id="flt"></div><div class="note" id="cnt" style="margin:4px 0 0"></div><table class="st" id="tbl"><colgroup><col style="width:56px"><col><col style="width:70px"><col style="width:74px"><col style="width:84px"></colgroup><thead id="th"></thead><tbody id="tb"></tbody></table>';
  h+='<div class="note">평당 = 호가÷(전용㎡÷3.3058) · 번호는 지도 북→남 · 열 제목 클릭=정렬, 아래 칸=필터</div>';
  $('panel').innerHTML=h; drawFlt(); drawList();
}
var FG=[['','전체'],['A','호가 형성'],['B','입주 초기']];
var COLS=[['no','번호'],['q','단지'],['y','입주'],['hh','세대수'],['pp','평균 평당']];
function hhn(c){return +c.hh.replace(/\(.*\)/,'').replace(/,/g,'')}
function ykey(c){return parseInt(c.appr)}
function val(c,k){return k==='no'?N(c):k==='q'?c.short:k==='y'?c.appr:k==='hh'?hhn(c):(c.overall?c.overall.ppAvg:null)}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n}
function drawFlt(){
  var h='<span class="fl">구분</span>';
  FG.forEach(function(a){h+='<button class="fc'+(F.g===a[0]?' on':'')+'" data-v="'+a[0]+'">'+a[1]+'</button>'});
  h+='<button class="fc" id="frs">필터 초기화</button>';
  $('flt').innerHTML=h;
  [].forEach.call($('flt').querySelectorAll('.fc[data-v]'),function(b){b.onclick=function(){F.g=b.getAttribute('data-v');drawFlt();drawList()}});
  $('frs').onclick=function(){F={g:'',q:'',r:{},s:'pp',d:-1};drawFlt();drawList()};
  var t='<tr>';
  COLS.forEach(function(c){t+='<th class="sh" data-k="'+c[0]+'">'+c[1]+'<span class="ar">'+(F.s===c[0]?(F.d>0?'▲':'▼'):'↕')+'</span></th>'});
  t+='</tr><tr class="fr">';
  COLS.forEach(function(c){var k=c[0];
    if(k==='q')t+='<td><input class="fi" data-k="q" placeholder="검색" value="'+F.q.replace(/"/g,'')+'"></td>';
    else{var r=F.r[k]||['',''];t+='<td><input class="fi h" data-k="'+k+'" data-e="0" placeholder="≥" value="'+r[0]+'"><input class="fi h" data-k="'+k+'" data-e="1" placeholder="≤" value="'+r[1]+'"></td>'}});
  t+='</tr>';
  $('th').innerHTML=t;
  [].forEach.call($('th').querySelectorAll('.sh'),function(e){e.onclick=function(){var k=e.getAttribute('data-k');if(k==='q'){F.s='q'}else if(F.s===k){F.d=-F.d}else{F.s=k;F.d=(k==='no'||k==='q')?1:-1}if(k==='q'&&F.s==='q'&&F.d===0)F.d=1;drawFlt();drawList()}});
  [].forEach.call($('th').querySelectorAll('.fi'),function(e){e.oninput=function(){var k=e.getAttribute('data-k');if(k==='q'){F.q=e.value}else{var r=F.r[k]||['',''];r[+e.getAttribute('data-e')]=e.value;F.r[k]=r}drawList()}});
}
function drawList(){
  var L=D.map(function(c,i){return {c:c,i:i}}).filter(function(x){var c=x.c;
    if(F.g&&c.group!==F.g)return false;
    if(F.q&&(c.short+c.name).indexOf(F.q)<0)return false;
    for(var k in F.r){var r=F.r[k],lo=num(r[0]),hi=num(r[1]);if(lo==null&&hi==null)continue;
      var v=k==='y'?ykey(c):val(c,k);if(v==null)return false;if(lo!=null&&v<lo)return false;if(hi!=null&&v>hi)return false}
    return true});
  var s=F.s,d=F.d;
  L.sort(function(a,b){var x=val(a.c,s),y=val(b.c,s);
    if(x==null&&y==null)return a.c.appr<b.c.appr?-1:1;if(x==null)return 1;if(y==null)return -1;
    if(x===y)return N(a.c)-N(b.c);return (x<y?-1:1)*d});
  $('cnt').textContent=L.length+'개 단지';
  var h='';
  L.forEach(function(x){var c=x.c,i=x.i,lk=c.lk?'<span class="lk">'+c.lk+'</span>':'';
    if(c.group==='A'){var o=c.overall;h+='<tr class="go" data-i="'+i+'"><td><span class="no A">'+N(c)+'</span></td><td class="nm">'+c.short+'<span class="cat">'+c.dong+' · 매물 '+o.n+'건</span></td><td class="c">'+yr(c)+'</td><td class="c">'+c.hh.replace(/\(.*\)/,'')+'</td><td class="v m">'+f0(o.ppAvg)+'</td></tr>'}
    else{var b=c.types.filter(function(t){return t.bunPP}), bp=b.length?Math.round(b.reduce(function(s2,t){return s2+t.bunPP*t.hh},0)/b.reduce(function(s2,t){return s2+t.hh},0)):null;
      h+='<tr class="go" data-i="'+i+'"><td><span class="no B">'+N(c)+'</span></td><td class="nm">'+c.short+lk+'<span class="cat">'+c.dong+(bp?' · 분양가 평균 평당 '+f0(bp):'')+'</span></td><td class="c">'+yr(c)+'</td><td class="c">'+c.hh+'</td><td class="na">'+(c.nv?(c.nv.sale?'네이버 매매 '+c.nv.sale.n+'건<small>평당 '+f0(c.nv.sale.pp)+'</small>':'매매 없음')+(c.nv.jw?'<small>전세 평당 '+f0(c.nv.jw.pp)+'</small>':''):'호가 없음')+'</td></tr>'}});
  $('tb').innerHTML=h||'<tr><td colspan="5" class="na">조건에 맞는 단지가 없습니다</td></tr>';wire();
}

fetch('index.html').then(function(r){return r.text()}).then(function(t){

}).catch(function(e){$('map').innerHTML='<div id="err">지도를 불러오지 못했습니다: '+e.message+'</div>'});
function initMap(){

  var ps=new kakao.maps.services.Places(),g=new kakao.maps.services.Geocoder(),pts=[],bounds=new kakao.maps.LatLngBounds(),els=[],ovs=[];

  window.__lab=function(){D.forEach(function(c,i){if(!els[i])return;var v=c.overall?f0(c.overall.ppAvg):'';els[i].lastChild.textContent=c.short+(v?' · '+v:'');els[i].classList.toggle('sel',i===cur);ovs[i].setZIndex(i===cur?10:1)})};
  function relax(){try{var pr=map.getProjection(),P=[],ids=[],k,i,j;
    for(i=0;i<D.length;i++){if(!pts[i]||!els[i])continue;var p=pr.containerPointFromCoords(pts[i]);P[i]={x:p.x,y:p.y,ox:0,oy:0};ids.push(i)}
    for(k=0;k<40;k++){for(var a=0;a<ids.length;a++)for(var b=a+1;b<ids.length;b++){i=ids[a];j=ids[b];var dx=P[i].x+P[i].ox-P[j].x-P[j].ox,dy=P[i].y+P[i].oy-P[j].y-P[j].oy,d=Math.sqrt(dx*dx+dy*dy),m=27;if(d<m){if(d<0.5){dx=Math.cos(i*2.4);dy=Math.sin(i*2.4);d=1}var f=(m-d)/2/d;P[i].ox+=dx*f;P[i].oy+=dy*f;P[j].ox-=dx*f;P[j].oy-=dy*f}}}
    ids.forEach(function(i){els[i].style.left=Math.round(P[i].ox)+'px';els[i].style.top=Math.round(P[i].oy)+'px'})}catch(e){}}

  var OK=kakao.maps.services.Status.OK;

  })});
