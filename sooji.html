<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사업수지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1b2a56;--bg:#f3f1ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);font-size:13px}
#top{height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px}
#top h1{font-size:15px;margin:0;font-weight:700}
#msg{padding:40px 20px;color:#555;text-align:center}
#wrap{height:calc(100% - 46px);overflow:auto;padding:14px 16px 28px}
#sheet{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0001;width:max-content;max-width:100%;margin:0 auto;overflow-x:auto}
table.sj{border-collapse:collapse;table-layout:fixed;font-family:inherit}
table.sj td{padding:0 4px;line-height:1.25;overflow:hidden;font-family:inherit}
#zm{position:fixed;right:22px;top:58px;display:flex;gap:4px;align-items:center;background:#fffffff0;border:1px solid #d9dce6;border-radius:8px;padding:3px 5px;box-shadow:0 1px 6px #0002;z-index:5}#zm button{border:0;background:#eef1f8;color:#1b2a56;font:inherit;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;cursor:pointer}#zm span{font-size:12px;min-width:44px;text-align:center;color:#333}
</style></head><body>
<div id="top"><h1 id="ttl">사업수지</h1></div>
<div id="zm"><button id="zo" title="축소">−</button><span id="zv">100%</span><button id="zi" title="확대">+</button><button id="zr" title="화면 너비에 맞춤">맞춤</button></div>
<div id="msg">로그인 확인 중…</div>
<div id="wrap" hidden><div id="sheet"></div></div>
<script>
(function(){
var bl=(location.search.match(/bl=(\d)/)||[])[1]==="6"?"6":"5";
document.getElementById("ttl").textContent="파주운정3지구 주복 "+bl+"BL 사업수지 (수지분석)";
document.title="사업수지 "+bl+"BL";
var done=false,Z=1,ZK="shopmaps:sj:zoom";
function setZ(z){Z=Math.max(0.4,Math.min(3,z));var s=document.getElementById("sheet");s.style.zoom=Z;s.style.maxWidth=Z>1?"none":"100%";document.getElementById("zv").textContent=Math.round(Z*100)+"%";try{localStorage.setItem(ZK,String(Z))}catch(e){}}
function fitZ(){var s=document.getElementById("sheet"),w=document.getElementById("wrap");s.style.zoom=1;s.style.maxWidth="none";var nat=s.scrollWidth,av=w.clientWidth-32;setZ(nat>0?av/nat:1)}
document.getElementById("zi").onclick=function(){setZ(Z+0.1)};document.getElementById("zo").onclick=function(){setZ(Z-0.1)};document.getElementById("zr").onclick=fitZ;
document.getElementById("wrap").addEventListener("wheel",function(e){if(e.ctrlKey){e.preventDefault();setZ(Z*(e.deltaY<0?1.08:1/1.08))}},{passive:false});
try{var z0=parseFloat(localStorage.getItem(ZK));if(z0>0)setZ(z0)}catch(e){}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function run(){
  if(done)return;
  var a=null;try{a=JSON.parse(localStorage.getItem("shopmaps:auth")||"null")}catch(e){}
  var msg=document.getElementById("msg");
  if(!a||!a.k||a.exp<Date.now()){msg.hidden=false;msg.textContent="로그인이 필요합니다. 처음 화면에서 아이디·비밀번호를 입력해 주세요.";return}
  try{
    var key=await crypto.subtle.importKey("raw",b64(a.k),"AES-GCM",false,["decrypt"]);
    var enc=await fetch("sooji"+bl+".enc",{cache:"no-store"}).then(function(r){return r.text()});
    var d=b64(enc.trim());
    var raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));
    var txt=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    var data=JSON.parse(txt);
    window.SOOJI={bl:bl,formulas:data.f};
    document.getElementById("sheet").innerHTML=data.h;document.getElementById("wrap").hidden=false;msg.hidden=true;done=true;
  }catch(e){msg.hidden=false;msg.textContent="자료를 열 수 없습니다. 다시 로그인해 주세요."}
}
run();setInterval(run,1500);
})();
</script></body></html>
