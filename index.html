<!doctype html>
<html lang="ko">
<head>
<script>try{if(window.top===window.self&&!/[?&]solo=1/.test(location.search))location.replace("app.html"+location.hash)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상가 분양가 지도</title>
<style>
:root{
  --navy:#1b2a56; --navy2:#2c3f7a; --paper:#ffffff; --bg:#f3f1ec; --line:#dfe2ea; --ink:#1d2433; --mute:#6b7488;
  --up:#d6453d; --down:#2f6fd6; --in:#2f6fd6; --bld:#12a39c; --site:#c0392b; --head:#eef1f7;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
#top{height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
#top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .src{margin-left:auto;font-size:11.5px;opacity:.85;white-space:nowrap}
#wrap{height:calc(100% - 46px);display:flex}
#mapbox{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
#side{width:clamp(560px,48vw,720px);background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#sidehead{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
#sidebody{flex:1;overflow:auto;padding:10px 14px 18px}
.legend{position:absolute;left:12px;top:12px;z-index:5;background:#fffffff2;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 6px #0002}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-right:7px;vertical-align:-1px}
.tools{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--head)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#fixpanel{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;width:340px;box-shadow:0 1px 8px #0003}
#fixpanel textarea{width:100%;height:96px;font:11px/1.35 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:6px;resize:vertical}
#fixpanel p{margin:0 0 6px;font-size:11.5px;color:var(--mute)}
.tip{background:#1d2433;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translateY(-6px);box-shadow:0 2px 6px #0004;pointer-events:none}
.tip b{font-weight:700}
.tip small{opacity:.8}
/* summary */
h2{font-size:14px;margin:0 0 2px}
.sub{color:var(--mute);font-size:11.5px}
table.st{border-collapse:collapse;width:100%;margin-top:8px;font-size:11px;table-layout:fixed}
table.st th,table.st td{border:1px solid var(--line);padding:4px 2px;text-align:center;white-space:nowrap;overflow:hidden}
table.st th{background:var(--head);font-weight:600;color:var(--navy)}
table.st td.nm{text-align:left;white-space:normal;line-height:1.25;word-break:keep-all;padding-left:5px}
table.st td.bs{white-space:normal;line-height:1.2;font-size:10px;word-break:keep-all;padding:2px 1px}
table.st td .chg{font-size:10.5px;letter-spacing:-.3px}
table.st tr.row{cursor:pointer}
table.st tr.row:hover td{background:#f6f8fd}
table.st tr.sel td{background:#fff6d8}
table.st tr.grp td{border-top:2px solid #b9c1d6}
table.st tr.avg td{background:#eef1f8;font-weight:700;border-top:2px solid #1f2d5c}
table.st tr.avg td.nm{color:var(--navy)}
table.st tr.avg.sub td{background:#f3f5fb;border-top:1px solid #1f2d5c;border-bottom:2px solid #b9c1d6}
table.st tr.avg.tot td{background:#dfe5f4;border-top:3px double #1f2d5c}
.no{display:inline-block;min-width:22px;padding:1px 5px;border-radius:11px;color:#fff;font-weight:700;font-size:11px}
.no.in{background:var(--in)} .no.bld{background:var(--bld)}
.cat{font-size:10.5px;color:var(--mute)}
.chg{font-weight:700}
.chg.u{color:var(--up)} .chg.d{color:var(--down)} .chg.z{color:var(--mute)}
.na{color:#a3aabb}
.note{font-size:11px;color:var(--mute);margin:8px 0 0;line-height:1.5}
/* detail */
.back{border:0;background:var(--head);color:var(--navy);font:inherit;font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;margin-bottom:8px}
.dh{display:flex;align-items:center;gap:8px}
.dh .no{font-size:13px;padding:3px 9px;border-radius:14px}
.dh h2{font-size:17px;margin:0;color:var(--navy)}
.meta{margin:8px 0 6px;color:var(--mute);font-size:12px}
.unit{float:right;font-size:11px;color:var(--mute);text-align:right;line-height:1.35}
table.dt{border-collapse:collapse;width:100%;font-size:12px}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 4px;text-align:center}
table.dt th{background:var(--head);color:var(--navy);font-weight:600;line-height:1.25}
table.dt td small{display:block;color:var(--mute);font-size:10.5px}
table.dt td.l{text-align:left}
table.dt td b{font-weight:700}
.bars{margin-top:14px}
.bars h3{font-size:13px;margin:0 0 2px;color:var(--navy)}
.bars .hint{font-size:11px;color:var(--mute);margin-bottom:6px}
.brow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.brow:last-of-type{border-bottom:1px solid var(--line)}
.blab{width:98px;font-size:11.5px;padding:5px 4px;line-height:1.25;border-right:1px solid var(--line)}
.blab small{display:block;color:var(--mute);font-size:10.5px}
.btrack{flex:1;position:relative;min-height:34px}
.btrack:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #b9c1d6}
.bar{position:absolute;top:9px;height:16px}
.bar.u{background:var(--up);left:50%;border-radius:0 4px 4px 0}
.bar.d{background:var(--down);right:50%;border-radius:4px 0 0 4px}
.bval{position:absolute;top:8px;font-weight:700;font-size:12px}
.bval.u{color:var(--up)} .bval.d{color:var(--down)}
.bnone{position:absolute;left:50%;top:9px;transform:translateX(8px);font-size:12px;color:var(--mute)}
.bnone.c{transform:translateX(-50%);background:#fff;padding:0 6px}
.baxis{display:flex;margin-left:98px;font-size:10.5px;color:var(--mute);justify-content:space-between;padding-top:3px}
.foot{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--mute);line-height:1.5}
.cmp{font-weight:700}
#sidebody{overflow-x:auto}
.lab{font-weight:700;color:#12206b;font-size:11.5px;line-height:1;text-align:center;pointer-events:auto;cursor:pointer;white-space:nowrap;padding:3px 6px}
.lab.sm{font-size:10px}
.dot{width:20px;height:20px;border-radius:50%;background:#0f8f89;color:#fff;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0006;cursor:pointer;transform:translate(-50%,-50%);font-family:inherit}
.legend i.lg-el{display:inline-block;width:18px;height:10px;border-radius:50%;transform:none;margin-right:7px;vertical-align:-1px;border:1px solid #fff9}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tabs button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tip .ln{display:block;line-height:1.5}
@media(max-width:900px){
  #wrap{flex-direction:column}
  #mapbox{flex:none;height:48%}
  #side{width:100%;flex:1;border-left:0;border-top:1px solid var(--line)}
  #top .src{display:none}
}
</style>
</head>
<body>
<div id="top"><h1 id="ttl">상가 분양가 지도</h1><span class="src" id="srcline"></span></div>
<div id="wrap">
  <div id="mapbox">
    <div id="map"></div>
    <div class="legend">
      <span><i class="lg-el" style="background:#ef4f6f"></i>A 급지 (인접·경쟁)</span>
      <span><i class="lg-el" style="background:#3f7be0"></i>B 급지</span>
      <span><i class="lg-el" style="background:#14a39a"></i>C 급지</span>
      <span><i class="lg-el" style="background:#8b5cf6"></i>D 급지</span>
      <span><i style="background:var(--site)"></i>SITE (사업지)</span>
    </div>
    <div class="tools">
      <div id="fixpanel">
        <p id="fixmsg">핀을 드래그해 실제 건물 위치에 맞추세요. 끝나면 좌표를 복사해 <b>data-unjeong-coords.js</b>의 <code>{}</code> 안에 붙여넣으세요.</p>
        <textarea id="fixout" readonly></textarea>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn" id="copyBtn">좌표 복사</button>
          <button class="btn" id="resetBtn">보정 초기화</button>
        </div>
      </div>
      <button class="btn" id="fixBtn">좌표 보정 모드</button>
    </div>
  </div>
  <aside id="side">
    <div id="sidehead"></div>
    <div id="sidebody"></div>
  </aside>
</div>

<script>
/* ===== 설정 (여기만 바꾸면 됩니다) ===== */
var CONFIG = {
  KAKAO_APP_KEY: "f6ade909379e30f39034a28f8302e8da", // 카카오 JavaScript 키 (developers.kakao.com)
  DEFAULT_REGION: "unjeong",                          // ?region=unjeong 처럼 주소로도 지정 가능
  SEARCH_RADIUS_M: 2500                               // 자동 검색 시 지역 중심에서 이 거리 밖 결과는 버림
};
/* ======================================= */

var qs = new URLSearchParams(location.search);
var REGION = (qs.get("region") || CONFIG.DEFAULT_REGION).replace(/[^a-z0-9_-]/gi, "");
var DATA, COORDS = {}, LOCAL_FIX = {};
var map, ps, markers = {}, tipOv, fixMode = false, selectedId = null, centerLL = null;
var LS_KEY = "shopmaps:" + REGION + ":fix";

function loadScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement("script"); s.src = src + (src.indexOf("data-") === 0 ? "?v=" + Date.now() : "");
    s.onload = res; s.onerror = function () { rej(new Error("load fail: " + src)); };
    document.head.appendChild(s);
  });
}
function fmt(n) { return n == null ? "-" : Math.round(n).toLocaleString("ko-KR"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function chgCls(v) { return v == null ? "z" : v > 0 ? "u" : v < 0 ? "d" : "z"; }
function parseChg(t) {
  if (!t) return null;
  var m = String(t).match(/^([▲▼])\s*([\d.]+)%/);
  if (m) return (m[1] === "▲" ? 1 : -1) * parseFloat(m[2]);
  if (/^0\.0%/.test(t)) return 0;
  return null;
}
function chgHtml(t) {
  if (!t || t === "-" || t === "호가 없음") return '<span class="na">-</span>';
  var v = parseChg(t); return '<span class="chg ' + chgCls(v) + '">' + esc(t) + "</span>";
}
function entries() { return DATA.sites.concat(DATA.complexes); }
function catOf(c) { return c.cat === "상가건물" ? "bld" : "in"; }
/* 급지 표기: A(경쟁·인접) / B / C / D — 표시용 번호 (내부 id는 그대로) */
var DISP = { "12": "A-1", "15": "A-2", "1": "B-1", "2": "B-2", "3": "B-3", "5": "C-1", "4": "C-2", "6": "C-3", "7": "C-4", "8": "C-5", "9": "C-6",
  "10": "D-1", "11-1": "D-2", "11-2": "D-3", "11-3": "D-4", "11-4": "D-5", "13": "D-6", "16": "D-7", "14-1": "D-8", "14-2": "D-9", "14-3": "D-10", "14-4": "D-11" };
function disp(id) { return DISP[id] || id; }
function dispNo(no) {
  var ms = members(no); if (!ms.length) return String(no);
  if (ms.length === 1) return disp(ms[0].id);
  var a = disp(ms[0].id), b = disp(ms[ms.length - 1].id); return a + "~" + b.split("-")[1];
}
function lbl(e) { return e.label === "SITE" ? "SITE" : disp(e.id); }

/* ---------- 핀 이미지 (SVG data URI) ---------- */
function pinImage(label, color, selected) {
  var w = selected ? 40 : 32, h = selected ? 52 : 42;
  var fs = label.length > 3 ? (selected ? 12 : 10) : (selected ? 16 : 13);
  var r = w / 2 - 2;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '">' +
    '<path d="M' + w / 2 + " " + (h - 1) + " C" + (w / 2 - 3) + " " + (h - 9) + " 2 " + (w * 0.62) + " 2 " + w / 2 + " A" + r + " " + r + " 0 1 1 " + (w - 2) + " " + w / 2 +
    " C" + (w - 2) + " " + (w * 0.62) + " " + (w / 2 + 3) + " " + (h - 9) + " " + w / 2 + " " + (h - 1) + 'Z" fill="' + color + '" stroke="' + (selected ? "#1d2433" : "#fff") + '" stroke-width="' + (selected ? 2.5 : 1.8) + '"/>' +
    '<text x="' + w / 2 + '" y="' + (w / 2 + fs * 0.36) + '" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-weight="700" font-size="' + fs + '" fill="#fff">' + label + "</text></svg>";
  return new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg),
    new kakao.maps.Size(w, h), { offset: new kakao.maps.Point(w / 2, h - 1) });
}
function colorOf(e) { return e.label === "SITE" ? "#c0392b" : (e.cat === "상가건물" ? "#12a39c" : "#2f6fd6"); }

/* ---------- 좌표 ---------- */
function coordOf(id) { return LOCAL_FIX[id] || COORDS[id] || null; }
function distM(a, b) {
  var R = 6371000, dLa = (b[0] - a[0]) * Math.PI / 180, dLo = (b[1] - a[1]) * Math.PI / 180;
  var x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function kw(q, opt) {
  return new Promise(function (res) { ps.keywordSearch(q, function (d, st) { res(st === kakao.maps.services.Status.OK ? d : []); }, opt || {}); });
}
async function locateCenter() {
  var d = await kw(DATA.centerQuery);
  var p = d[0];
  centerLL = p ? [+p.y, +p.x] : [37.7145, 126.7545];
  return centerLL;
}
async function autoLocate(e) {
  for (var i = 0; i < e.q.length; i++) {
    var d = await kw(e.q[i], { location: new kakao.maps.LatLng(centerLL[0], centerLL[1]), radius: CONFIG.SEARCH_RADIUS_M, sort: kakao.maps.services.SortBy.DISTANCE });
    d = d.filter(function (p) { return distM(centerLL, [+p.y, +p.x]) <= CONFIG.SEARCH_RADIUS_M; });
    if (d.length) { return { ll: [+(+d[0].y).toFixed(6), +(+d[0].x).toFixed(6)], hit: d[0].place_name + " / " + (d[0].road_address_name || d[0].address_name) }; }
  }
  return null;
}
window.__autoReport = {};

/* ---------- 마커 / PPT식 타원 ---------- */
var CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
function circ(n) { n = parseInt(n, 10); return n >= 1 && n <= 20 ? CIRC.charAt(n - 1) : String(n); }
var SHAPES = [], shapeObjs = {}, dotObjs = {}, handles = {}, SITE_PINS = {};
function members(no) { return DATA.complexes.filter(function (c) { return String(c.no) === String(no); }); }
function isGroup(no) { return members(no).length > 1; }
function shapeKeys() { return SHAPES.map(function (sh) { return sh.id; }); }
function hasShape(c) { return SHAPES.some(function (sh) { return sh.n === String(c.no); }); }
function shapeCenter(sh) { return coordOf(sh.id) || sh.c; }
function dotEntries() { return DATA.complexes.filter(function (c) { return isGroup(c.no) && hasShape(c); }); }
function pinEntries() { return DATA.sites.concat(DATA.complexes.filter(function (c) { return !hasShape(c); })); }

function ellipsePath(sh) {
  var c = shapeCenter(sh), a = sh.w / 2, b = sh.h / 2, th = (sh.rot || 0) * Math.PI / 180, pts = [];
  var kLat = 111320, kLng = 111320 * Math.cos(c[0] * Math.PI / 180);
  for (var i = 0; i < 48; i++) {
    var t = i / 48 * 2 * Math.PI, x = a * Math.cos(t), y = b * Math.sin(t);
    var xr = x * Math.cos(th) - y * Math.sin(th), yr = x * Math.sin(th) + y * Math.cos(th);
    pts.push(new kakao.maps.LatLng(c[0] - yr / kLat, c[1] + xr / kLng));
  }
  return pts;
}
var TIER = { A: { f: "#ef4f6f", t: "#a8123a" }, B: { f: "#3f7be0", t: "#1b4fb0" }, C: { f: "#14a39a", t: "#0b6e68" }, D: { f: "#8b5cf6", t: "#5b34b8" } };
function shapeTier(sh) { var m = members(sh.n)[0]; return TIER[m ? disp(m.id).charAt(0) : "D"] || TIER.D; }
function pillStyle(e) { var t = TIER[disp(e.id).charAt(0)] || TIER.D; return "background:" + t.t; }
function shapeColor(sh) { return shapeTier(sh).f; }
function shapeTip(sh) {
  var ms = members(sh.n);
  if (ms.length > 1) {
    return "<b>" + dispNo(sh.n) + " 상가건물 " + ms.length + "곳</b>" + ms.map(function (m) { return '<span class="ln">' + esc(disp(m.id)) + " " + esc(m.name) + " · " + f1Txt(m) + "</span>"; }).join("");
  }
  var m = ms[0]; return "<b>" + esc(disp(m.id)) + ". " + esc(m.name) + "</b><span class='ln'>1층 평당 호가 " + f1Txt(m) + "</span>";
}
function f1Txt(e) {
  var s = DATA.summary.filter(function (x) { return x.id === e.id; })[0], f = s && s.f1 ? s.f1.curTxt : "-";
  return /^\d/.test(f) ? "<b>" + f + "</b> 만원/평" : (f === "-" ? "-" : esc(f));
}
function drawShape(sh) {
  var old = shapeObjs[sh.id];
  if (old) { old.poly.setMap(null); old.lab.setMap(null); }
  var col = shapeColor(sh), c = shapeCenter(sh);
  var poly = new kakao.maps.Polygon({ map: map, path: ellipsePath(sh), strokeWeight: 1.5, strokeColor: shapeTier(sh).t, strokeOpacity: 0.85, fillColor: col, fillOpacity: 0.32, zIndex: 2 });
  var el = document.createElement("div"); el.className = "lab" + (dispNo(sh.n).length > 3 ? " sm" : ""); el.textContent = dispNo(sh.n); var tc = shapeTier(sh).t; el.style.color = "#fff"; el.style.textShadow = "1px 0 " + tc + ",-1px 0 " + tc + ",0 1px " + tc + ",0 -1px " + tc + ",1px 1px " + tc + ",-1px -1px " + tc + ",1px -1px " + tc + ",-1px 1px " + tc + ",0 0 3px " + tc;
  el.onclick = function () { var ms = members(sh.n); if (ms.length) openDetail(ms[0].id, false); };
  el.onmouseenter = function () { tipOv.setContent('<div class="tip">' + shapeTip(sh) + "</div>"); tipOv.setPosition(new kakao.maps.LatLng(c[0], c[1])); tipOv.setMap(map); };
  el.onmouseleave = function () { tipOv.setMap(null); };
  var lab = new kakao.maps.CustomOverlay({ map: map, position: new kakao.maps.LatLng(c[0], c[1]), content: el, zIndex: 4, clickable: true, xAnchor: 0.5, yAnchor: 0.5 });
  kakao.maps.event.addListener(poly, "mouseover", function (ev) { tipOv.setContent('<div class="tip">' + shapeTip(sh) + "</div>"); tipOv.setPosition(ev.latLng); tipOv.setMap(map); });
  kakao.maps.event.addListener(poly, "mousemove", function (ev) { tipOv.setPosition(ev.latLng); });
  kakao.maps.event.addListener(poly, "mouseout", function () { tipOv.setMap(null); });
  kakao.maps.event.addListener(poly, "click", function () { var ms = members(sh.n); if (ms.length) openDetail(ms[0].id, false); });
  shapeObjs[sh.id] = { poly: poly, lab: lab };
}
function drawDot(e) {
  var c = coordOf(e.id) || e.tmp; if (!c) return;
  var old = dotObjs[e.id]; if (old) old.setMap(null);
  var div = document.createElement("div"); div.className = "dot"; div.textContent = disp(e.id).split("-")[1] || disp(e.id);
  div.onmouseenter = function () { tipOv.setContent('<div class="tip"><b>' + esc(disp(e.id)) + ". " + esc(e.name) + "</b><span class='ln'>1층 평당 호가 " + f1Txt(e) + "</span></div>"); tipOv.setPosition(new kakao.maps.LatLng(c[0], c[1])); tipOv.setMap(map); };
  div.onmouseleave = function () { tipOv.setMap(null); };
  div.onclick = function () { openDetail(e.id, false); };
  var ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(c[0], c[1]), content: div, zIndex: 6, yAnchor: 0.5, xAnchor: 0.5 });
  dotObjs[e.id] = ov; ov.__e = e;
}
function updateDots() {
  var show = map.getLevel() <= 3 && !fixMode;
  Object.keys(dotObjs).forEach(function (k) { dotObjs[k].setMap(show ? map : null); });
}
function pinImage(label, color, selected) {
  var w = selected ? 40 : 32, h = selected ? 52 : 42, fs = label.length > 3 ? (selected ? 12 : 10) : (selected ? 16 : 13), r = w / 2 - 2;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '">' +
    '<path d="M' + w / 2 + " " + (h - 1) + " C" + (w / 2 - 3) + " " + (h - 9) + " 2 " + (w * 0.62) + " 2 " + w / 2 + " A" + r + " " + r + " 0 1 1 " + (w - 2) + " " + w / 2 +
    " C" + (w - 2) + " " + (w * 0.62) + " " + (w / 2 + 3) + " " + (h - 9) + " " + w / 2 + " " + (h - 1) + 'Z" fill="' + color + '" stroke="' + (selected ? "#1d2433" : "#fff") + '" stroke-width="' + (selected ? 2.5 : 1.8) + '"/>' +
    '<text x="' + w / 2 + '" y="' + (w / 2 + fs * 0.36) + '" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-weight="700" font-size="' + fs + '" fill="#fff">' + label + "</text></svg>";
  return new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), new kakao.maps.Size(w, h), { offset: new kakao.maps.Point(w / 2, h - 1) });
}
function handleImage() {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#ffd400" stroke="#1d2433" stroke-width="2"/><path d="M11 5v12M5 11h12" stroke="#1d2433" stroke-width="2"/></svg>';
  return new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), new kakao.maps.Size(22, 22), { offset: new kakao.maps.Point(11, 11) });
}
function colorOf(e) { return e.label === "SITE" ? "#c0392b" : (e.cat === "상가건물" ? "#12a39c" : "#2f6fd6"); }
function placePin(e) {
  var c = coordOf(e.id) || e.tmp; if (!c) return;
  var pos = new kakao.maps.LatLng(c[0], c[1]), m = SITE_PINS[e.id];
  if (!m) {
    m = new kakao.maps.Marker({ position: pos, image: pinImage(lbl(e), colorOf(e), false), draggable: false, clickable: true, zIndex: 3 });
    m.setMap(map); SITE_PINS[e.id] = m; m.__e = e;
    kakao.maps.event.addListener(m, "mouseover", function () { tipOv.setContent('<div class="tip">' + (e.label === "SITE" ? "<b>SITE</b> · " + esc(e.name) : "<b>" + esc(disp(e.id)) + ". " + esc(e.name) + "</b><span class='ln'>1층 평당 호가 " + f1Txt(e) + "</span>") + "</div>"); tipOv.setPosition(m.getPosition()); tipOv.setMap(map); });
    kakao.maps.event.addListener(m, "mouseout", function () { tipOv.setMap(null); });
    kakao.maps.event.addListener(m, "click", function () { if (e.label !== "SITE") openDetail(e.id, false); });
    kakao.maps.event.addListener(m, "dragend", function () { var p = m.getPosition(); LOCAL_FIX[e.id] = [+p.getLat().toFixed(6), +p.getLng().toFixed(6)]; saveFix(); renderFix(); });
  } else m.setPosition(pos);
}
function setSelected(id) {
  selectedId = id;
  var no = null; var c = DATA.complexes.filter(function (x) { return x.id === id; })[0]; if (c) no = String(c.no);
  SHAPES.forEach(function (sh) { var o = shapeObjs[sh.id]; if (o) { var sel = no !== null && sh.n === no; o.poly.setOptions({ strokeWeight: sel ? 2.5 : 1.5, strokeColor: shapeTier(sh).t, fillOpacity: sel ? 0.5 : 0.32, zIndex: sel ? 5 : 2 }); } });
  Object.keys(SITE_PINS).forEach(function (k) { var m = SITE_PINS[k], e = m.__e, sel = k === id; m.setImage(pinImage(lbl(e), colorOf(e), sel)); m.setZIndex(sel ? 10 : 3); });
  Object.keys(dotObjs).forEach(function (k) { var d = dotObjs[k].getContent(); d.style.background = k === id ? "#111a44" : "#0f8f89"; d.style.transform = "translate(-50%,-50%)" + (k === id ? " scale(1.25)" : ""); });
  document.querySelectorAll("tr.row").forEach(function (tr) { tr.classList.toggle("sel", tr.dataset.id === id); });
}
function allPoints() {
  var pts = [];
  SHAPES.forEach(function (sh) { pts.push(shapeCenter(sh)); });
  pinEntries().forEach(function (e) { var c = coordOf(e.id) || e.tmp; if (c) pts.push(c); });
  return pts;
}
function fitAll() {
  var b = new kakao.maps.LatLngBounds(), pts = allPoints();
  pts.forEach(function (c) { b.extend(new kakao.maps.LatLng(c[0], c[1])); });
  if (pts.length) map.setBounds(b, 70, 70, 70, 70);
}
function focusComplex(id) {
  var c = DATA.complexes.filter(function (x) { return x.id === id; })[0]; if (!c) return;
  var co = coordOf(id) || c.tmp; if (!co) { var sh = SHAPES.filter(function (s) { return s.n === String(c.no); })[0]; co = sh && shapeCenter(sh); }
  if (co) { if (map.getLevel() > 4) map.setLevel(4); map.panTo(new kakao.maps.LatLng(co[0], co[1])); }
}

/* ---------- 보정 모드 ---------- */
function saveFix() { try { localStorage.setItem(LS_KEY, JSON.stringify(LOCAL_FIX)); } catch (e) { } }
function loadFix() { try { LOCAL_FIX = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { LOCAL_FIX = {}; } }
function allCoords() {
  var o = {};
  SHAPES.forEach(function (sh) { o[sh.id] = shapeCenter(sh); });
  dotEntries().forEach(function (e) { var c = coordOf(e.id) || e.tmp; if (c) o[e.id] = c; });
  pinEntries().forEach(function (e) { var c = coordOf(e.id) || e.tmp; if (c) o[e.id] = c; });
  return o;
}
function renderFix() {
  var o = allCoords(), lines = Object.keys(o).map(function (k) { return '  "' + k + '": [' + o[k][0] + ", " + o[k][1] + "]"; });
  document.getElementById("fixout").value = lines.join(",\n");
}
function clearHandles() { Object.keys(handles).forEach(function (k) { handles[k].setMap(null); }); handles = {}; }
function makeHandle(key, c, onMove) {
  var m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(c[0], c[1]), image: handleImage(), draggable: true, zIndex: 30 });
  m.setMap(map); handles[key] = m;
  kakao.maps.event.addListener(m, "dragend", function () { var p = m.getPosition(); LOCAL_FIX[key] = [+p.getLat().toFixed(6), +p.getLng().toFixed(6)]; saveFix(); onMove(); renderFix(); });
}
function setFixMode(on) {
  fixMode = on;
  document.getElementById("fixBtn").classList.toggle("on", on);
  document.getElementById("fixBtn").textContent = on ? "좌표 보정 모드 끄기" : "좌표 보정 모드";
  document.getElementById("fixpanel").style.display = on ? "block" : "none";
  clearHandles();
  Object.keys(SITE_PINS).forEach(function (k) { SITE_PINS[k].setDraggable(on); });
  if (on) {
    SHAPES.forEach(function (sh) { makeHandle(sh.id, shapeCenter(sh), function () { drawShape(sh); }); });
    dotEntries().forEach(function (e) { var c = coordOf(e.id) || e.tmp; if (c) makeHandle(e.id, c, function () { drawDot(e); }); });
    renderFix();
  }
  updateDots();
}

/* ---------- 우측 패널: 층별 요약 (기본) ---------- */
function floorCells(f) {
  if (!f) return '<td class="na">-</td><td class="na">-</td><td class="na">-</td>';
  var cur = /^\d/.test(f.curTxt) ? fmt(f.cur) : '<span class="na">' + (f.curTxt === "-" ? "-" : esc(f.curTxt)) + "</span>";
  var base = f.baseTxt === "-" ? '<span class="na">-</span>' : fmt(f.base);
  return "<td>" + base + "</td><td><b>" + cur + "</b></td><td>" + chgHtml(f.chg) + "</td>";
}
function avgCells(key, list) {
  var rows = (list || DATA.summary).filter(function (s) { var f = s[key]; return f && f.base != null && f.cur != null && /^\d/.test(f.curTxt); });
  if (!rows.length) return '<td class="na">-</td><td class="na">-</td><td class="na">-</td>';
  var b = 0, c = 0; rows.forEach(function (s) { b += s[key].base; c += s[key].cur; });
  b /= rows.length; c /= rows.length;
  var ch = (c / b - 1) * 100, t = (ch > 0 ? "▲ " : ch < 0 ? "▼ " : "") + Math.abs(ch).toFixed(1) + "%";
  return "<td>" + fmt(Math.round(b)) + "</td><td>" + fmt(Math.round(c)) + "</td><td>" + chgHtml(t) + '<br><span class="na" style="font-size:9.5px">' + rows.length + "곳</span></td>";
}
function showSummary() {
  selectedId = null; setSelected(null);
  document.getElementById("sidehead").innerHTML = '<h2>운정중앙역 상가 층별 기준가 대비 현재 호가</h2><div class="sub">단위: 만원/평 · 전용면적 3.3㎡당 · 기준가(분양가·낙찰가·내정가·기존 조사가) 대비 현재 네이버 호가의 전용 평당가 변화 · 행을 누르면 단지 상세</div>';
  var h = '<table class="st"><colgroup><col style="width:44px"><col style="width:100px"><col style="width:60px">' + '<col>'.repeat(9) + '</colgroup><thead><tr><th rowspan="2">번호</th><th rowspan="2">단지 · 건물</th><th rowspan="2">기준가<br>종류</th><th colspan="3">1층</th><th colspan="3">2층</th><th colspan="3">3층 이상</th></tr><tr>';
  for (var i = 0; i < 3; i++) h += "<th>기준가</th><th>현재<br>호가</th><th>증감률</th>";
  h += "</tr></thead><tbody>";
  var order = DATA.summary.slice().sort(function (a, b) {
    var x = disp(a.id).split("-"), y = disp(b.id).split("-");
    return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : (+x[1] || 0) - (+y[1] || 0);
  });
  var tiers = [];
  order.forEach(function (s) { var t = disp(s.id).charAt(0); var g = tiers[tiers.length - 1]; if (!g || g.t !== t) { g = { t: t, rows: [] }; tiers.push(g); } g.rows.push(s); });
  tiers.forEach(function (g, gi) {
    g.rows.forEach(function (s, ri) {
      var grp = gi > 0 && ri === 0 ? " grp" : "";
      h += '<tr class="row' + grp + '" data-id="' + esc(s.id) + '"><td><span class="no ' + catOf(s) + '" style="' + pillStyle(s) + '">' + esc(disp(s.id)) + '</span></td>' +
        '<td class="nm">' + esc(s.name) + '<br><span class="cat">' + esc(s.cat) + "</span></td><td class='bs'>" + esc(s.basis) + "</td>" +
        floorCells(s.f1) + floorCells(s.f2) + floorCells(s.f3) + "</tr>";
    });
    h += '<tr class="avg sub"><td colspan="3" class="nm">' + g.t + ' 소계<br><span class="cat">' + g.rows.length + '곳 단순평균</span></td>' + avgCells("f1", g.rows) + avgCells("f2", g.rows) + avgCells("f3", g.rows) + "</tr>";
  });
  h += '<tr class="avg tot"><td colspan="3" class="nm">전체 평균<br><span class="cat">기준가·호가가 모두 있는 단지</span></td>' + avgCells("f1") + avgCells("f2") + avgCells("f3") + "</tr>";
  h += "</tbody></table>";
  h += '<div class="note">' + DATA.summaryNotes.map(esc).join("<br>") + "<br>· A=우미린·디이스트(가장 가까운 경쟁 급지) / B / C / D 급지 · 소계·전체 평균 = 기준가와 현재 호가가 모두 있는 단지의 단순평균(층별 곳 수 표기), 증감률 = 평균 호가 ÷ 평균 기준가 − 1" + "</div>";
  h += '<div class="foot">' + esc(DATA.source) + " · " + esc(DATA.unit) + "</div>";
  var body = document.getElementById("sidebody"); body.innerHTML = h; body.scrollTop = 0;
  body.querySelectorAll("tr.row").forEach(function (tr) { tr.onclick = function () { openDetail(tr.dataset.id, true); }; });
}

/* ---------- 우측 패널: 단지 상세 ---------- */
function barRow(r) {
  var lab = '<div class="blab">' + esc(r.area) + "<small>" + esc(r.areaSub) + "</small></div>", t = "";
  if (r.ask == null) t = '<div class="bnone c">호가 없음</div>';
  else if (r.chg == null) t = '<div class="bnone">비교 없음</div>';
  else {
    var pct = Math.min(Math.abs(r.chg), 30) / 30 * 48, cls = r.chg > 0 ? "u" : r.chg < 0 ? "d" : "z";
    if (r.chg === 0) t = '<div class="bnone">0.0%</div>';
    else if (r.chg > 0) t = '<div class="bar u" style="width:' + pct + '%"></div><div class="bval u" style="left:calc(50% + ' + pct + '% + 6px)">▲ ' + Math.abs(r.chg).toFixed(1) + "%</div>";
    else t = '<div class="bar d" style="width:' + pct + '%"></div><div class="bval d" style="right:calc(50% + ' + pct + '% + 6px)">▼ ' + Math.abs(r.chg).toFixed(1) + "%</div>";
  }
  return '<div class="brow">' + lab + '<div class="btrack">' + t + "</div></div>";
}
function openDetail(id, pan) {
  var c = DATA.complexes.filter(function (x) { return x.id === id; })[0]; if (!c) return;
  setSelected(id);
  if (pan) focusComplex(id);
  document.getElementById("sidehead").innerHTML = '<button class="back" id="backBtn">← 층별 요약 표로</button>' +
    '<div class="dh"><span class="no ' + catOf(c) + '" style="' + pillStyle(c) + '">' + esc(disp(c.id)) + "</span><h2>" + esc(c.name) + '</h2><span class="unit" style="margin-left:auto">단위: 만원<br>평당가는 전용면적 3.3㎡당</span></div>';
  var base = c.basis === "(기준 없음)" ? "기준가" : c.basis;
  var h = "", ms = members(c.no);
  if (ms.length > 1) h += '<div class="tabs">' + ms.map(function (m) { return '<button data-id="' + esc(m.id) + '" class="' + (m.id === c.id ? "on" : "") + '">' + esc(disp(m.id)) + " " + esc(m.name) + "</button>"; }).join("") + "</div>";
  h += '<div class="meta">' + esc(c.meta) + "</div>";
  h += '<div style="overflow-x:auto"><table class="dt" style="min-width:480px"><thead><tr><th rowspan="2">면적</th><th colspan="2">' + esc(base) + '</th><th colspan="2">현재 호가 (네이버)</th><th rowspan="2">변동<br><small>' + esc(base) + ' 대비</small></th><th rowspan="2">실거래<br><small>국토부 · 참고</small></th></tr><tr><th>' + esc(base) + "</th><th>전용 평당가</th><th>호가</th><th>전용 평당가</th></tr></thead><tbody>";
  c.rows.forEach(function (r) {
    h += "<tr><td class='l'>" + esc(r.area) + "<small>" + esc(r.areaSub) + "</small></td>" +
      "<td>" + (r.base != null ? "<b>" + fmt(r.base) + "</b>" + (r.baseNote ? "<small>" + esc(r.baseNote) + "</small>" : "") : '<span class="na">-</span>') + "</td>" +
      "<td>" + (r.basePP != null ? fmt(r.basePP) : '<span class="na">-</span>') + "</td>" +
      "<td>" + (r.ask != null ? "<b>" + fmt(r.ask) + "</b>" + (r.askN ? "<small>" + esc(r.askN) + "</small>" : "") : '<span class="na">-</span>' + (r.askNote ? "<small>" + esc(r.askNote) + "</small>" : "")) + "</td>" +
      "<td>" + (r.askPP != null ? fmt(r.askPP) : '<span class="na">-</span>') + "</td>" +
      "<td>" + chgHtml(r.chgTxt) + (r.chgNote ? "<small>" + esc(r.chgNote) + "</small>" : "") + "</td>" +
      "<td>" + (r.trade.length > 1 || /\d/.test(r.trade[0] || "") ? esc(r.trade[0]) + (r.trade[1] ? "<small>" + esc(r.trade[1]) + "</small>" : "") : '<span class="na">' + esc(r.trade[0] || "-") + "</span>") + "</td></tr>";
  });
  h += "</tbody></table></div>";
  h += '<div class="bars"><h3>' + esc(base) + ' 대비 현재 호가 변동률</h3><div class="hint">오른쪽 상승 ▲(빨강) / 왼쪽 하락 ▼(파랑) · 눈금 ±30% 고정</div>' +
    c.rows.map(barRow).join("") + '<div class="baxis"><span>-30%</span><span>0</span><span>+30%</span></div></div>';
  if (c.notes && c.notes.length) h += '<div class="note">' + c.notes.map(esc).join("<br>") + "</div>";
  h += '<div class="foot">' + esc(DATA.source) + "</div>";
  var body = document.getElementById("sidebody"); body.innerHTML = h; body.scrollTop = 0;
  document.getElementById("backBtn").onclick = showSummary;
  body.querySelectorAll(".tabs button").forEach(function (b) { b.onclick = function () { openDetail(b.dataset.id, true); }; });
}

/* ---------- 시작 ---------- */
async function main() {
  try {
    await loadScript("data-" + REGION + ".js");
    DATA = window.SHOP_REGIONS[REGION];
    try { await loadScript("data-" + REGION + "-coords.js"); COORDS = (window.SHOP_COORDS || {})[REGION] || {}; } catch (e) { }
    try { await loadScript("data-" + REGION + "-shapes.js"); SHAPES = (window.SHOP_SHAPES || {})[REGION] || []; } catch (e) { SHAPES = []; }
  } catch (e) { document.getElementById("sidebody").textContent = "지역 데이터를 불러오지 못했습니다: " + REGION; return; }
  document.title = DATA.title; document.getElementById("ttl").textContent = DATA.title;
  document.getElementById("srcline").textContent = DATA.source;
  loadFix();
  showSummary();
  if (CONFIG.KAKAO_APP_KEY.indexOf("여기에") >= 0) { document.getElementById("map").innerHTML = "<p style='padding:20px'>CONFIG.KAKAO_APP_KEY에 카카오 JavaScript 키를 넣어주세요.</p>"; return; }
  try { await loadScript("https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + CONFIG.KAKAO_APP_KEY + "&libraries=services&autoload=false"); }
  catch (e) { document.getElementById("map").innerHTML = "<p style='padding:20px'>카카오 지도 SDK를 불러오지 못했습니다. 앱 키와 등록된 웹 도메인(" + location.origin + ")을 확인하세요.</p>"; return; }
  await new Promise(function (r) { kakao.maps.load(r); });
  ps = new kakao.maps.services.Places();
  await locateCenter();
  map = new kakao.maps.Map(document.getElementById("map"), { center: new kakao.maps.LatLng(centerLL[0], centerLL[1]), level: 4 });  // ROADMAP 일반지도만 사용
  tipOv = new kakao.maps.CustomOverlay({ yAnchor: 1.45, zIndex: 20 });
  // 좌표가 없는 항목은 키워드 검색으로 임시 좌표 부여 (보정 후 coords 파일에 저장)
  var missing = pinEntries().concat(dotEntries()).filter(function (e) { return !coordOf(e.id); });
  for (var i = 0; i < missing.length; i++) {
    var r = await autoLocate(missing[i]);
    if (r) { missing[i].tmp = r.ll; window.__autoReport[missing[i].id] = r; }
    else window.__autoReport[missing[i].id] = null;
  }
  SHAPES.forEach(drawShape);
  dotEntries().forEach(drawDot);
  pinEntries().forEach(placePin);
  kakao.maps.event.addListener(map, "zoom_changed", updateDots);
  updateDots();
  fitAll();
  document.getElementById("fixBtn").onclick = function () { setFixMode(!fixMode); };
  document.getElementById("copyBtn").onclick = function () {
    var t = document.getElementById("fixout"); t.select();
    try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); }
    document.getElementById("copyBtn").textContent = "복사됨 ✓"; setTimeout(function () { document.getElementById("copyBtn").textContent = "좌표 복사"; }, 1500);
  };
  document.getElementById("resetBtn").onclick = function () {
    LOCAL_FIX = {}; saveFix();
    SHAPES.forEach(drawShape); dotEntries().forEach(drawDot); updateDots();
    pinEntries().forEach(function (e) { var c = coordOf(e.id) || e.tmp; if (c && SITE_PINS[e.id]) SITE_PINS[e.id].setPosition(new kakao.maps.LatLng(c[0], c[1])); });
    if (fixMode) { setFixMode(false); setFixMode(true); } else renderFix();
  };
  window.__ready = true;
}
main();
</script>
