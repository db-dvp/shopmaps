<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파주·일산 오피스텔 호가 평당가</title>
<style>
:root{--navy:#1b2a56;--navy2:#2c3f7a;--line:#dfe2ea;--up:#d6453d;--down:#2f6fd6;--in:#2f6fd6;--bld:#12a39c;--mut:#6b7488;--bg:#eef1f7;--page:#f3f1ec;--ink:#1d2433}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--page);font-size:13px}
header{height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}header #title{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header span.s{margin-left:auto;font-weight:400;font-size:11.5px;opacity:.85;white-space:nowrap}
#wrap{display:flex;height:calc(100% - 46px)}
#mapbox{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
#panel{width:clamp(560px,48vw,720px);overflow:auto;border-left:1px solid var(--line);background:#fff;padding:12px 14px 18px}
.legend{position:absolute;left:12px;top:12px;z-index:5;background:#fffffff2;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 6px #0002}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}.legend .lg2{color:var(--mut);font-size:11px}.legend .zb{display:flex;gap:4px}.legend .zb button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}.legend .zb button:hover{background:var(--bg)}
.pin{position:relative;cursor:pointer}.pin.L{--c:#2f6fd6}.pin.S{--c:#12a39c}.pin.H{--c:#8a5cc7}.pin.W{--c:#e08a1e}.pin .n{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}.pin .t{display:none;position:absolute;left:26px;top:50%;transform:translateY(-50%);background:var(--c);color:#fff;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 4px #0006}.pin:hover .t,.pin.sel .t{display:block}.pin.sel .n{transform:scale(1.25)}
.bd{display:inline-flex;width:17px;height:17px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:6px;vertical-align:1px}.bd.L{background:#2f6fd6}.bd.S{background:#12a39c}.bd.H{background:#8a5cc7}.bd.W{background:#e08a1e}
h2{font-size:16px;margin:0 0 2px}
.sub{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.5}
h3{font-size:13px;margin:16px 0 6px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:right}
th{background:var(--bg);text-align:center;font-weight:700}
td.l{text-align:left}
.up{color:var(--up);font-weight:700}.dn{color:var(--down);font-weight:700}
.note{font-size:11px;color:var(--mut);line-height:1.55;margin-top:8px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;margin-right:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.x{color:#6b7280;font-size:11px}.big{display:flex;gap:10px;margin:6px 0}.big>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.big .k{display:block;font-size:11px;color:var(--mut)}.big b{font-size:24px;color:var(--navy)}.big .u{font-size:11px;color:var(--mut);margin-left:4px}.rg{font-size:15px;margin:20px 0 0;padding-top:8px;border-top:2px solid var(--navy)}tr.go{cursor:pointer}tr.go:hover td{background:var(--bg)}.warn{font-size:12px;color:var(--up);margin-top:6px}.modes{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--navy);border-radius:6px;overflow:hidden}.mode{flex:1;border:0;background:#fff;color:var(--navy);padding:7px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}.mode.on{background:var(--navy);color:#fff}.mode+.mode{border-left:1px solid var(--navy)}
#panel{padding:10px 14px 18px}
#panel>h2{font-size:14px;margin:0 0 2px}.sub{font-size:11.5px;color:var(--mut);margin-bottom:0;line-height:1.45}
table.st{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.5px;table-layout:fixed}
table.st th,table.st td{border:1px solid var(--line);padding:7px 3px;text-align:center;white-space:nowrap;overflow:hidden}
table.st th{background:var(--bg);font-weight:600;color:var(--navy);font-size:12px;padding:5px 2px}
table.st td.v{font-weight:700}table.st td.c{color:var(--mut);font-size:11px}table.st td.c.na{color:#b4bac8}
table.st td.nm{text-align:left;white-space:normal;line-height:1.25;word-break:keep-all;padding-left:5px}
table.st td.nm .cat{display:block;font-size:11px;color:var(--mut)}
table.st td.bs{white-space:normal;line-height:1.2;font-size:11px;word-break:keep-all;padding:2px 1px}
table.st tr.rg td{background:var(--navy);color:#fff;font-weight:700;text-align:left;padding:8px 9px;border:0;font-size:13.5px;letter-spacing:-.2px}table.st tr.rg td small{display:inline;font-weight:600;color:#fff;background:#ffffff2e;padding:2px 9px;border-radius:10px;font-size:11.5px;margin-left:9px;vertical-align:1px}
table.st td.m{font-size:15.5px;font-weight:700;color:var(--navy)}table.st td.o{font-size:12.5px;color:#39425a}table.st td small{display:block;font-size:10.5px;font-weight:400;color:var(--mut);margin-top:1px}table.st td.na small,table.st td.na{color:#b4bac8}
table.st tr.gh td{background:#e3e8f3;color:var(--navy);font-weight:700;text-align:left;padding:5px 7px;border-top:2px solid #b9c1d6;font-size:11.5px}
table.st tr.avg td{background:#eef1f8;font-weight:700;border-top:2px solid #1f2d5c}table.st tr.avg td.nm{color:var(--navy)}
table.st tr.go{cursor:pointer}table.st tr.go:hover td{background:#f6f8fd}
.na{color:#a3aabb}
.no{display:inline-block;min-width:22px;padding:1px 5px;border-radius:11px;color:#fff;font-weight:700;font-size:11px;text-align:center}.no.L{background:#2f6fd6}.no.S{background:#12a39c}.no.H{background:#8a5cc7}.no.W{background:#e08a1e}
.back{border:0;background:var(--bg);color:var(--navy);font:inherit;font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;margin-bottom:8px}.back:hover{background:#e3e8f3}
.dh{display:flex;align-items:center;gap:8px}.dh .no{font-size:13px;padding:3px 9px;border-radius:14px}.dh h2{font-size:17px;margin:0;color:var(--navy)}
.meta{margin:8px 0 8px;color:var(--mut);font-size:12px;line-height:1.5}
#err{padding:20px;color:#b91c1c;font-size:13px}
@media(max-width:800px){#wrap{flex-direction:column}#mapbox{height:45%;flex:none}#panel{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header><div id="title"></div><span class="s" id="src"></span></header>
<div id="wrap"><div id="mapbox"><div id="map"></div><div class="legend"><span><i style="background:var(--in)"></i>대형 단지 (전용 60㎡ 이상)</span><span><i style="background:var(--bld)"></i>소형 단지 (전용 60㎡ 미만)</span><span><i style="background:#8a5cc7"></i>생활숙박시설 (오피스텔과 별도)</span><span><i style="background:#e08a1e"></i>라이브오피스 (오피스텔과 별도)</span><span class="zb" id="zb"></span><span class="lg2">번호 = 단지 번호 · 마우스를 올리면 이름·평당가(선택한 탭 기준)</span></div></div><div id="panel"><div id="err"></div></div></div>
<script src="data-officetel.js"></script>
<script src="data-officetel-kb.js"></script>
<script src="data-officetel-rent.js"></script>
<script src="data-officetel-yadang.js"></script>
<script src="data-officetel-tanhyeon.js"></script>
<script>
(function(){
/* 지도 번호: 위→아래, 같은 높이는 왼쪽→오른쪽 순 (표 순서는 매매 평당가순 그대로) */
var NOS=[7,10,2,1,4,3,5,6,9,8,13,14,16,17,15,18,19,20,21,22,23,24,25,11,12,26,27,28,29];function NOF(i){return NOS[i]||(i+1)}
var D=(window.OFFICETEL_DATA||[]).concat(window.OFFICETEL_DATA2||[]).concat(window.OFFICETEL_DATA3||[]).concat(window.OFFICETEL_DATA4||[]), $=function(i){return document.getElementById(i)};
$('title').textContent='파주·일산 오피스텔 최근 호가 · 평당가'; $('src').textContent='호가: 네이버·KB부동산 26.10 / 같은 매물 합침';
function eok(v){return (v/10000).toFixed(2)+'억'}
function chg(cur,base){
  var p=(cur/base-1)*100; var c=p>0.05?'up':(p<-0.05?'dn':'');
  return '<span class="'+c+'">'+(p>0?'▲ ':(p<0?'▼ ':''))+Math.abs(p).toFixed(1)+'%</span>';
}
var cur=0, mode='m', RENT=window.OFFICETEL_RENT||{}, MN={m:'매매',j:'전세',w:'월세'};
function rentOf(c){return RENT[c.id]||{}}
function bd(i){return '<span class="bd '+sizeOf(D[i])+'">'+NOF(i)+'</span>'}
function tabs(){
  if(cur<0) return '';
  var h='<button class="back" data-back="1">← 전체 목록</button><div class="modes">';
  ['m','j','w'].forEach(function(k){h+='<button class="mode'+(mode===k?' on':'')+'" data-m="'+k+'">'+MN[k]+'</button>'});
  return h+'</div>';
}
function sizeOf(c){ if(c.kind==='라이브오피스')return 'W'; if(c.kind==='생숙')return 'H'; if(c.byType){var m=c.byType.length?Math.max.apply(null,c.byType.map(function(r){return r.ex})):(c.maxEx||0);return m>=60?'L':'S'} return (c.target&&c.target.min>=60)?'L':'S'; }
function statOf(c){ if(c.byType) return c.overall.n?{n:c.overall.n,avg:c.overall.ppEx.avg,med:c.overall.ppEx.med}:null; var a=c.asking; if(!a) return null; var m=a.label.match(/(\d+)건/); return {n:m?+m[1]:0,avg:a.perPyeong.avg,med:a.perPyeong.median}; }
var REGIONS=['운정','야당','대화','탄현'];
function yld(c,w){ var st=statOf(c); if(!st||!w||w.n<3||st.n<3) return null; var base=st.avg-w.ppDep; return base>0?(w.ppRent*12/base*100):null; }
function wavg(list,f,nf){var tn=0,ta=0;list.forEach(function(o){var v=f(o);if(v!=null){tn+=nf(o);ta+=v*nf(o)}});return tn?{v:ta/tn,n:tn}:null}
function overview(){
  var f0=function(v){return Math.round(v).toLocaleString()}, f1=function(v){return v.toFixed(1)};
  var h='<h2>파주·일산 오피스텔 최근 호가 · 평당가</h2><div class="sub">단위: 만원/평 · 전용면적 3.3㎡당 · 대형 = 전용 60㎡ 이상, 소형 = 60㎡ 미만 · 행을 누르면 단지 상세</div>';
  h+='<table class="st"><colgroup><col style="width:40px"><col><col style="width:84px"><col style="width:84px"><col style="width:84px"></colgroup>';
  var hd='<tr><th>번호</th><th>단지</th><th>매매 평당</th><th>전세 평당</th><th>월세 평당</th></tr>';
  var cell=function(cls,v,n,fmt){return v==null?'<td class="na">-</td>':'<td class="'+cls+(n<3?' na':'')+'">'+fmt(v)+'<small>'+n+'건</small></td>'};
  REGIONS.forEach(function(rg){
    var groups=[]; [['L','대형 (전용 60㎡ 이상)'],['S','소형 (전용 60㎡ 미만)'],['H','생활숙박시설 (오피스텔과 별도)'],['W','라이브오피스 (오피스텔과 별도)']].forEach(function(sz){
      var list=[]; D.forEach(function(c,i){ if((c.region||'운정')===rg && sizeOf(c)===sz[0]){
        var st=statOf(c),R=rentOf(c),j=R.j,w=R.w;
        list.push({c:c,i:i,m:st,j:j||null,w:w||null,mv:st?st.avg:null,jv:j?j.ppAvg:null,wv:w?w.ppRent:null,
          ratio:(st&&j&&j.n>=3&&st.n>=3)?j.ppAvg/st.avg*100:null,y:yld(c,w)}); } });
      if(list.length){ list.sort(function(a,b){return NOF(a.i)-NOF(b.i)}); groups.push([sz,list]); }
    });
    if(!groups.length)return;
    var total=0; groups.forEach(function(g){total+=g[1].length});
    h+='<tr class="rg"><td colspan="5">'+rg+'<small>'+total+'개 단지</small></td></tr>'+hd;
    groups.forEach(function(g){ var sz=g[0], list=g[1];
      h+='<tr class="gh"><td colspan="5">'+sz[1]+'</td></tr>';
      list.forEach(function(o){var c=o.c, ap=(c.approval&&c.approval!=='-')?c.approval:'';
        h+='<tr class="go" data-i="'+o.i+'"><td><span class="no '+sz[0]+'">'+NOF(o.i)+'</span></td><td class="nm">'+c.short+'<span class="cat">'+(c.households?c.households.toLocaleString()+'세대':'')+(c.households&&ap?' · ':'')+(ap?'입주 '+ap:'')+'</span></td>'+
          cell('m',o.mv,o.m?o.m.n:0,f0)+cell('o',o.jv,o.j?o.j.n:0,f0)+
          cell('o',o.wv,o.w?o.w.n:0,f1)+'</tr>'; });
      if(list.length>1){
        var am=wavg(list,function(o){return o.mv},function(o){return o.m.n}),aj=wavg(list,function(o){return o.jv},function(o){return o.j.n}),aw=wavg(list,function(o){return o.wv},function(o){return o.w.n});
        var ac=function(a,fmt,cls){return a?'<td class="'+cls+'">'+fmt(a.v)+'<small>'+a.n+'건</small></td>':'<td>-</td>'};
        h+='<tr class="avg"><td></td><td class="nm">건수 가중 평균</td>'+ac(am,f0,'o')+ac(aj,f0,'o')+ac(aw,f1,'o')+'</tr>';
      }
    });
  });
  h+='</table><div class="note">출처: 네이버부동산·KB부동산 매물 호가(2026.10 조회, 같은 매물 합침). 숫자 밑의 작은 글씨는 호가 건수이고, 회색 숫자는 표본 3건 미만이라 참고용입니다. 오피스텔은 전세보다 월세 매물이 많아 전세가 비어 있는 단지가 많습니다. 호가는 실제 거래가보다 높을 수 있습니다. 보증금·월세 단위는 만원.</div>';
  $('panel').innerHTML=h; wire(); if(window.__lab)window.__lab();
}
function wire(){
  [].forEach.call(document.querySelectorAll('.back'),function(b){b.onclick=function(){render(-1)}});
  [].forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){mode=b.getAttribute('data-m');render(cur)}});
  [].forEach.call(document.querySelectorAll('tr.go'),function(b){b.onclick=function(){var k=+b.getAttribute('data-i');render(k);if(window.__go&&k>=0)window.__go(k)}});
}
function rentDetail(c){
  var R=rentOf(c), st=statOf(c), h='', t=R[mode];
  if(!t){ return '<div class="note" style="margin-top:12px">이 단지는 KB부동산에 등록된 <b>'+MN[mode]+' 매물이 없습니다</b> ('+(mode==='j'?'월세 위주 단지':'조회 시점 기준')+').</div>'; }
  var n=t.n;
  if(mode==='j'){
    var ratio=(st&&t.n>=3&&st.n>=3)?t.ppAvg/st.avg*100:null;
    h+='<div class="big"><div><span class="k">평균 전세 평당 (전용)</span><b>'+t.ppAvg.toLocaleString()+'</b><span class="u">만원/평</span></div><div><span class="k">중앙값 전세 평당</span><b>'+t.ppMed.toLocaleString()+'</b><span class="u">만원/평</span></div></div>';
    h+='<div class="note">KB부동산 전세 매물 '+n+'건 · 평균 전세가 '+t.avg.toLocaleString()+'만원 ('+eok(t.avg)+')'+(ratio?' · 전세가율 약 '+ratio.toFixed(0)+'% (전세 평당 ÷ 매매 호가 평당 '+st.avg.toLocaleString()+')':'')+'</div>';
    if(n<5) h+='<div class="warn">※ 전세 표본이 '+n+'건뿐이라 대표성이 낮습니다.</div>';
    h+='<h3>평형(타입)별 전세 호가</h3><table><tr><th>타입</th><th>전용㎡</th><th>건수</th><th>평균(만원)</th><th>최저~최고</th><th>전용 평당</th></tr>';
    t.byType.forEach(function(r){h+='<tr><td>'+r.type+'</td><td>'+r.ex.toFixed(1)+'</td><td>'+r.n+'</td><td>'+r.avg.toLocaleString()+' ('+eok(r.avg)+')</td><td>'+eok(r.mn)+(r.mx>r.mn?' ~ '+eok(r.mx):'')+'</td><td>'+r.ppEx.toLocaleString()+'</td></tr>'});
    h+='</table>';
  } else {
    var y=yld(c,t);
    h+='<div class="big"><div><span class="k">평균 월세 평당 (전용·월)</span><b>'+t.ppRent.toFixed(1)+'</b><span class="u">만원/평</span></div><div><span class="k">평균 보증금 / 월세</span><b>'+t.dep.toLocaleString()+' / '+t.rent+'</b><span class="u">만원</span></div></div>';
    h+='<div class="note">KB부동산 월세 매물 '+n+'건 · 보증금 평당 평균 '+t.ppDep.toLocaleString()+'만원'+(y!=null?' · 추정 수익률 연 약 '+y.toFixed(1)+'% (월세×12 ÷ (매매 평당 '+st.avg.toLocaleString()+' − 보증금 평당 '+t.ppDep.toLocaleString()+'))':'')+'</div>';
    if(n<5) h+='<div class="warn">※ 월세 표본이 '+n+'건뿐이라 대표성이 낮습니다.</div>';
    h+='<h3>평형(타입)별 월세 호가</h3><table><tr><th>타입</th><th>전용㎡</th><th>건수</th><th>보증금 평균</th><th>월세 평균(범위)</th><th>월세 평당</th></tr>';
    t.byType.forEach(function(r){h+='<tr><td>'+r.type+'</td><td>'+r.ex.toFixed(1)+'</td><td>'+r.n+'</td><td>'+r.dep.toLocaleString()+'</td><td>'+r.rent+(r.rentMx>r.rentMn?' ('+r.rentMn+'~'+r.rentMx+')':'')+'</td><td>'+r.ppRent.toFixed(1)+'</td></tr>'});
    h+='</table>';
  }
  return h;
}
function render(i){
  if(i<0){cur=-1;overview();return;}
  cur=i; var c=D[i], a=c.asking;
  var h=tabs()+'<div class="dh"><span class="no '+sizeOf(c)+'">'+NOF(i)+'</span><h2>'+c.name+'</h2></div><div class="meta">'+(c.address?c.address+' · ':'')+(c.households?c.households.toLocaleString()+'세대 · ':'')+(c.approval&&c.approval!=='-'?'입주 '+c.approval:'세대수·입주 미확인')+'<br>'+c.developer+'</div>';
  if(mode!=='m'){ h+=rentDetail(c); }

    h+='<div class="note">'+o.label+' · 조회 '+o.date+' · 전용 평당 = 호가 ÷ (전용㎡ ÷ 3.3058), 공급 평당 = 호가 ÷ (계약㎡ ÷ 3.3058)</div>';
    h+='<div class="note">공급 기준 평당가: 평균 '+o.ppSu.avg.toLocaleString()+' · 중앙 '+o.ppSu.med.toLocaleString()+' 만원/평 (KB 매물 목록에 표시되는 방식)</div>';
    if(o.n<10) h+='<div class="warn">※ 호가 표본이 '+o.n+'건뿐이라 대표성이 낮습니다.</div>';
    h+='<h3>평형(타입)별 호가</h3><table><tr><th>타입</th><th>전용/계약㎡</th><th>건수</th><th>평균(만원)</th><th>최저~최고</th><th>전용 평당</th><th>공급 평당</th></tr>';
    c.byType.forEach(function(r){h+='<tr><td>'+r.type+'</td><td>'+r.ex.toFixed(1)+' / '+r.su.toFixed(1)+'</td><td>'+r.n+'</td><td>'+r.avg.toLocaleString()+' ('+eok(r.avg)+')</td><td>'+eok(r.mn)+(r.mx>r.mn?' ~ '+eok(r.mx):'')+'</td><td>'+r.ppEx.toLocaleString()+'</td><td>'+r.ppSu.toLocaleString()+'</td></tr>'});
    h+='</table>';
    if((c.refs||[]).length){
      h+='<h3>참고: KB 시세 · 실거래</h3><table><tr><th>구분</th><th>금액(만원)</th><th>전용 평당(만원)</th></tr>';
      c.refs.forEach(function(r){h+='<tr><td class="l">'+r.label+'<br><span class="x">'+r.note+'</span></td><td>'+r.v.toLocaleString()+' ('+eok(r.v)+')</td><td>'+Math.round(r.v/(r.ex/3.3058)).toLocaleString()+'</td></tr>'});
      h+='</table>';
    }
  } else {
  h=tabs()+'<div class="dh"><span class="no '+sizeOf(c)+'">'+NOF(i)+'</span><h2>'+c.name+'</h2></div><div class="meta">'+c.address+' · '+c.households.toLocaleString()+'세대 · 입주 '+c.approval+'<br>'+c.developer+'</div>';
  if(!a){ h+='<div class="note">네이버 호가: 미확보</div>'; }
  else {
    var div=a.avg/a.perPyeong.avg;
    function pp(v){return Math.round(v/div)}
    var m=a.label.match(/(\d+)건/), n=m?+m[1]:0;
    h+='<div class="big"><div><span class="k">평균 평당가</span><b>'+a.perPyeong.avg.toLocaleString()+'</b><span class="u">만원/평</span></div><div><span class="k">중앙값 평당가</span><b>'+a.perPyeong.median.toLocaleString()+'</b><span class="u">만원/평</span></div></div>';
    h+='<div class="note">'+a.label+' · 조회 '+a.date+' · 전용면적 기준 평당가 (평 = 전용㎡ ÷ 3.3058)</div>';
    if(n&&n<5) h+='<div class="warn">※ 호가 표본이 '+n+'건뿐이라 대표성이 낮습니다.</div>';
    h+='<h3>최근 호가 ('+c.target.label+')</h3><table><tr><th>구분</th><th>호가(만원)</th><th>전용 평당(만원)</th></tr>';
    function row(label,v,extra,pv){h+='<tr><td class="l">'+label+(extra?'<br><span class="x">'+extra+'</span>':'')+'</td><td>'+v.toLocaleString()+' ('+eok(v)+')</td><td>'+(pv||pp(v)).toLocaleString()+'</td></tr>'}
    row('평균',a.avg,null,a.perPyeong.avg);
    row('중앙값',a.median,null,a.perPyeong.median);
    row('최저',a.min,null,a.perPyeong.min);
    row('최고',a.max,null,a.perPyeong.max);
    (a.byFloor||[]).forEach(function(f){row('호가 '+f.f+' 평균',f.avg,f.n+'건')});

    if((c.refs||[]).length){
      h+='<h3>참고: 타입별 호가 · 실거래 · KB</h3><table><tr><th>구분</th><th>금액(만원)</th><th>전용 평당(만원)</th></tr>';
      c.refs.forEach(function(r){row(r.label,r.v,r.note)});

  }
  }
  (c.extra||[]).forEach(function(t){h+='<div class="note">· '+t+'</div>'});
  h+='<div class="note">출처: 네이버부동산·KB부동산 매물 호가, 국토부 신고 실거래(호갱노노). 중개사 중복 등록 가능성이 있고 호가는 실제 거래가보다 높을 수 있습니다.</div>';
  $('panel').innerHTML=h;
  wire(); if(window.__lab)window.__lab();
}

// 카카오 지도: 기존 index.html 과 같은 JavaScript 키를 index.html 에서 읽어 사용
fetch('index.html').then(function(r){return r.text()}).then(function(t){
  var im=t.match(/appkey=['"`]\s*\+\s*([A-Za-z_$][\w$.]*)/);
  if(!im) throw new Error('키 위치를 찾지 못함');
  var last=im[1].split('.').pop();
  var km=new RegExp('\\b'+last.replace(/\$/g,'\\$')+'\\b\\s*[:=]\\s*[\'"`]([^\'"`]{10,})[\'"`]').exec(t);
  if(!km) throw new Error('키 값을 찾지 못함');
  var s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js'+String.fromCharCode(63)+'appkey='+km[1]+'&libraries=services&autoload=false';
  s.onload=function(){kakao.maps.load(initMap)};
  s.onerror=function(){$('map').innerHTML='<div id="err">지도 SDK를 불러오지 못했습니다.</div>'};
  document.head.appendChild(s);
}).catch(function(e){$('map').innerHTML='<div id="err">지도를 불러오지 못했습니다: '+e.message+'</div>'});

function initMap(){
  var map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.7215,126.7640),level:4});
  var ps=new kakao.maps.services.Places(), g=new kakao.maps.services.Geocoder(), pts=[], bounds=new kakao.maps.LatLngBounds();
  var els=[],ovs=[]; window.__go=function(i){ if(pts[i]) map.panTo(pts[i]); };
  window.__lab=function(){ D.forEach(function(c,i){ if(!els[i])return; var R=rentOf(c),st=statOf(c),v='';
    if(mode==='m') v=st?st.avg.toLocaleString():''; else if(mode==='j') v=R.j?R.j.ppAvg.toLocaleString():'전세 없음'; else v=R.w?'월 '+R.w.ppRent.toFixed(1):'월세 없음';
    els[i].lastChild.textContent=c.short+(v?' · '+v:''); els[i].classList.toggle('sel',i===cur); ovs[i].setZIndex(i===cur?10:1); }); };
  function relax(){ try{ var pr=map.getProjection(),P=[],ids=[],k,i,j;
    for(i=0;i<D.length;i++){ if(!pts[i]||!els[i])continue; var p=pr.containerPointFromCoords(pts[i]); P[i]={x:p.x,y:p.y,ox:0,oy:0}; ids.push(i); }
    for(k=0;k<40;k++){ for(var a=0;a<ids.length;a++)for(var b=a+1;b<ids.length;b++){ i=ids[a];j=ids[b];
      var dx=P[i].x+P[i].ox-P[j].x-P[j].ox, dy=P[i].y+P[i].oy-P[j].y-P[j].oy, d=Math.sqrt(dx*dx+dy*dy), m=27;
      if(d<m){ if(d<0.5){dx=Math.cos(i*2.4);dy=Math.sin(i*2.4);d=1;} var f=(m-d)/2/d; P[i].ox+=dx*f;P[i].oy+=dy*f;P[j].ox-=dx*f;P[j].oy-=dy*f; } } }
    ids.forEach(function(i){ els[i].style.left=Math.round(P[i].ox)+'px'; els[i].style.top=Math.round(P[i].oy)+'px'; }); }catch(e){} }
  kakao.maps.event.addListener(map,'idle',relax);
  window.__zoom=function(rg){ var b=new kakao.maps.LatLngBounds(),n=0; D.forEach(function(c,i){ if(pts[i]&&(!rg||(c.region||'운정')===rg)){b.extend(pts[i]);n++} }); if(n){window.__zoomed=true;map.setBounds(b);} };
  (function(){ var z=$('zb'); if(!z)return; z.innerHTML='<button data-r="">전체</button><button data-r="운정">운정</button><button data-r="야당">야당</button><button data-r="탄현">탄현</button>'; [].forEach.call(z.querySelectorAll('button'),function(b){b.onclick=function(){window.__zoom(b.getAttribute('data-r'))}}); })();
  D.forEach(function(c,i){
    (c.ll?function(cb){cb([{y:c.ll[0],x:c.ll[1]}],kakao.maps.services.Status.OK)}:c.kw?function(cb){ps.keywordSearch(c.kw,cb)}:function(cb){g.addressSearch(c.geocode,cb)})(function(res,st){
      if(st!==kakao.maps.services.Status.OK||!res.length) return;
      var pos=new kakao.maps.LatLng(res[0].y,res[0].x); pts[i]=pos;
      bounds.extend(pos);
      var el=document.createElement('div'); el.className='pin '+sizeOf(c); el.innerHTML='<span class="n">'+NOF(i)+'</span><span class="t"></span>';
      el.onclick=function(){render(i)};
      var iw=new kakao.maps.CustomOverlay({position:pos,xAnchor:0.5,yAnchor:0.5,content:el,clickable:true,zIndex:1});
      el.onmouseenter=function(){iw.setZIndex(20)}; el.onmouseleave=function(){iw.setZIndex(i===cur?10:1)};
      ovs[i]=iw; els[i]=el;
      iw.setMap(map);
      if(!window.__zoomed)map.setBounds(bounds); if(window.__lab)window.__lab(); relax();
    });
  });
}
})();
