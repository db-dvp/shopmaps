<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운정역 오피스텔 호가 평당가</title>
<style>
:root{--navy:#1b2a5c;--line:#d9dee8;--up:#d93025;--down:#1a6fd1;--mut:#6b7280;--bg:#f4f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#1f2937}
header{height:38px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:700}
header span.s{font-weight:400;font-size:12px;opacity:.9}
#wrap{display:flex;height:calc(100% - 38px)}
#map{flex:1;min-width:0}
#panel{width:520px;max-width:55%;overflow:auto;border-left:1px solid var(--line);background:#fff;padding:14px 16px}
h2{font-size:16px;margin:0 0 2px}
.sub{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.5}
h3{font-size:13px;margin:16px 0 6px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:right}
th{background:var(--bg);text-align:center;font-weight:700}
td.l{text-align:left}
.up{color:var(--up);font-weight:700}.dn{color:var(--down);font-weight:700}
.note{font-size:11px;color:var(--mut);line-height:1.55;margin-top:8px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;margin-right:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.x{color:#6b7280;font-size:11px}.big{display:flex;gap:10px;margin:6px 0}.big>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.big .k{display:block;font-size:11px;color:var(--mut)}.big b{font-size:24px;color:var(--navy)}.big .u{font-size:11px;color:var(--mut);margin-left:4px}.warn{font-size:12px;color:var(--up);margin-top:6px}
#err{padding:20px;color:#b91c1c;font-size:13px}
@media(max-width:800px){#wrap{flex-direction:column}#map{height:45%;flex:none}#panel{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header><div id="title"></div><span class="s" id="src"></span></header>
<div id="wrap"><div id="map"></div><div id="panel"><div id="err"></div></div></div>
<script src="data-officetel.js"></script>
<script>
(function(){
var D=window.OFFICETEL_DATA, $=function(i){return document.getElementById(i)};
$('title').textContent='운정역 오피스텔 최근 호가 · 평당가';
function eok(v){return (v/10000).toFixed(2)+'억'}
function chg(cur,base){
  var p=(cur/base-1)*100; var c=p>0.05?'up':(p<-0.05?'dn':'');
  return '<span class="'+c+'">'+(p>0?'▲ ':(p<0?'▼ ':''))+Math.abs(p).toFixed(1)+'%</span>';
}
var cur=0;
function tabs(){
  var h='<div class="tabs">';
  D.forEach(function(c,i){h+='<button class="tab'+(i===cur?' on':'')+'" data-i="'+i+'">'+c.short+'</button>'});
  return h+'</div>';
}
function render(i){
  cur=i; var c=D[i], a=c.asking;
  var h=tabs()+'<h2>'+c.name+'</h2><div class="sub">'+c.address+' · '+c.households.toLocaleString()+'세대 · 입주 '+c.approval+'<br>'+c.developer+'</div>';
  if(!a){ h+='<div class="note">네이버 호가: 미확보</div>'; }
  else {
    var div=a.avg/a.perPyeong.avg;
    function pp(v){return Math.round(v/div)}
    var m=a.label.match(/(\d+)건/), n=m?+m[1]:0;
    h+='<div class="big"><div><span class="k">평균 평당가</span><b>'+a.perPyeong.avg.toLocaleString()+'</b><span class="u">만원/평</span></div><div><span class="k">중앙값 평당가</span><b>'+a.perPyeong.median.toLocaleString()+'</b><span class="u">만원/평</span></div></div>';
    h+='<div class="note">'+a.label+' · 조회 '+a.date+' · 전용면적 기준 평당가 (평 = 전용㎡ ÷ 3.3058)</div>';
    if(n&&n<5) h+='<div class="warn">※ 호가 표본이 '+n+'건뿐이라 대표성이 낮습니다.</div>';
    h+='<h3>최근 호가 ('+c.target.label+')</h3><table><tr><th>구분</th><th>호가(만원)</th><th>전용 평당(만원)</th></tr>';
    function row(label,v,extra,pv){h+='<tr><td class="l">'+label+(extra?'<br><span class="x">'+extra+'</span>':'')+'</td><td>'+v.toLocaleString()+' ('+eok(v)+')</td><td>'+(pv||pp(v)).toLocaleString()+'</td></tr>'}
    row('평균',a.avg,null,a.perPyeong.avg);
    row('중앙값',a.median,null,a.perPyeong.median);
    row('최저',a.min,null,a.perPyeong.min);
    row('최고',a.max,null,a.perPyeong.max);
    (a.byFloor||[]).forEach(function(f){row('호가 '+f.f+' 평균',f.avg,f.n+'건')});
    h+='</table>';
    if((c.refs||[]).length){
      h+='<h3>참고: 타입별 호가 · 실거래 · KB</h3><table><tr><th>구분</th><th>금액(만원)</th><th>전용 평당(만원)</th></tr>';
      c.refs.forEach(function(r){row(r.label,r.v,r.note)});
      h+='</table>';
    }
  }
  (c.extra||[]).forEach(function(t){h+='<div class="note">· '+t+'</div>'});
  h+='<div class="note">출처: 네이버부동산 호가, 국토부 신고 실거래(호갱노노), KB부동산. 중개사 중복 등록 가능성이 있고 호가는 실제 거래가보다 높을 수 있습니다.</div>';
  $('panel').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){render(+b.getAttribute('data-i'));if(window.__go)window.__go(+b.getAttribute('data-i'))}});
}
render(0);

// 카카오 지도: 기존 index.html 과 같은 JavaScript 키를 index.html 에서 읽어 사용
fetch('index.html').then(function(r){return r.text()}).then(function(t){
  var im=t.match(/appkey=['"`]\s*\+\s*([A-Za-z_$][\w$.]*)/);
  if(!im) throw new Error('키 위치를 찾지 못함');
  var last=im[1].split('.').pop();
  var km=new RegExp('\\b'+last.replace(/\$/g,'\\$')+'\\b\\s*[:=]\\s*[\'"`]([^\'"`]{10,})[\'"`]').exec(t);
  if(!km) throw new Error('키 값을 찾지 못함');
  var s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js'+String.fromCharCode(63)+'appkey='+km[1]+'&libraries=services&autoload=false';
  s.onload=function(){kakao.maps.load(initMap)};
  s.onerror=function(){$('map').innerHTML='<div id="err">지도 SDK를 불러오지 못했습니다.</div>'};
  document.head.appendChild(s);
}).catch(function(e){$('map').innerHTML='<div id="err">지도를 불러오지 못했습니다: '+e.message+'</div>'});

function initMap(){
  var map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.7215,126.7640),level:4});
  var g=new kakao.maps.services.Geocoder(), pts=[], bounds=new kakao.maps.LatLngBounds();
  window.__go=function(i){ if(pts[i]) map.panTo(pts[i]); };
  D.forEach(function(c,i){
    g.addressSearch(c.geocode,function(res,st){
      if(st!==kakao.maps.services.Status.OK||!res.length) return;
      var pos=new kakao.maps.LatLng(res[0].y,res[0].x); pts[i]=pos;
      bounds.extend(pos);
      var mk=new kakao.maps.Marker({map:map,position:pos});
      var iw=new kakao.maps.CustomOverlay({position:pos,yAnchor:2.3,content:'<div style="background:#1b2a5c;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap">'+c.short+(c.asking?' · '+c.asking.perPyeong.avg.toLocaleString():'')+'</div>'});
      iw.setMap(map);
      kakao.maps.event.addListener(mk,'click',function(){render(i)});
      map.setBounds(bounds);
    });
  });
}
})();
</script>
</body>
</html>
